<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
    <ion-title>Mot de passe oublié</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="forgot-container">
    <h1>Réinitialiser le mot de passe</h1>
    <p class="subtitle">
      Entre ton adresse e-mail. Si le compte existe, tu recevras les instructions.
    </p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <ion-item lines="none" class="field">
        <ion-icon slot="start" name="mail-outline"></ion-icon>
        <ion-input
          formControlName="email"
          type="email"
          inputmode="email"
          autocomplete="email"
          placeholder="Adresse e-mail"
        ></ion-input>
      </ion-item>

      <ion-text color="danger" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
        <p class="error">Entre une adresse e-mail valide.</p>
      </ion-text>

      <ion-button
        expand="block"
        shape="round"
        type="submit"
        [disabled]="isSubmitting"
        class="submit-btn"
      >
        <ng-container *ngIf="!isSubmitting">Envoyer</ng-container>
        <ion-spinner *ngIf="isSubmitting" name="crescent"></ion-spinner>
      </ion-button>
    </form>

    <ion-card *ngIf="message" class="result-card">
      <ion-card-content>
        <p>{{ message }}</p>

        <div class="dev-token" *ngIf="devResetToken">
          <p class="dev-title">Mode local (développement)</p>
          <code>{{ devResetToken }}</code>
          <ion-button size="small" fill="outline" (click)="copyToken()">
            Copier le token
          </ion-button>
          <ion-button size="small" (click)="goToReset()">Continuer</ion-button>
        </div>

        <a *ngIf="devResetUrl" [href]="devResetUrl">{{ devResetUrl }}</a>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
