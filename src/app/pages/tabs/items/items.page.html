<ion-content [fullscreen]="true">

  <ion-grid>
    <ion-row>
      <ion-col size="3">
        <ion-button fill="clear" class="ion-margin" (click)="navCtrl.back()">
          <ion-icon slot="icon-only" name="arrow-back-outline" color="dark"></ion-icon>
        </ion-button>

        <div>
          <ion-button color="primary-contrast" class="ion-margin">
            <ion-icon slot="icon-only" name="sunny" color="primary"></ion-icon>
          </ion-button>
          <ion-button color="primary-contrast" class="ion-margin">
            <ion-icon slot="icon-only" name="thermometer-outline" color="primary"></ion-icon>
          </ion-button>
          <ion-button color="primary-contrast" class="ion-margin">
            <ion-icon slot="icon-only" name="water-outline" color="primary"></ion-icon>
          </ion-button>
          <ion-button color="primary-contrast" class="ion-margin">
            <ion-icon name="snow-outline" slot="icon-only" color="primary"></ion-icon>
          </ion-button>
        </div>
      </ion-col>
      <ion-col size="9">
        <div class="legacy-slide-box">
          <img [src]="item?.img" alt="illustration article" loading="lazy" decoding="async" />
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-item lines="none" class="ion-margin-vertical">
    <ion-label>
      {{item?.name}}
      <p><ion-text color="tertiary" >{{item?.category}}</ion-text> </p>
    </ion-label>
    <ion-text class="price"  class="ion-margin" color="light" slot="end">
      <!-- <b>${{item?.price}}</b> -->      
      <ion-button color="primary-contrast" class="ion-margin">
        <ion-icon slot="icon-only" name="heart-outline" color="primary"></ion-icon>
      </ion-button>
    </ion-text>
  </ion-item>

  <ion-card>
    <ion-card-header>
      <img [src]="item?.img1" alt="cholera-edna" loading="lazy" decoding="async">
      <ion-card-title> {{item?.name}}</ion-card-title>
      <ion-card-subtitle>{{item?.desc}}</ion-card-subtitle>
    </ion-card-header>
  </ion-card>

</ion-content>

<ion-footer class="ion-no-border">
  <ion-toolbar>
    <ion-row>
       <ion-col size="6" class="ion-text-center buy">
        <ion-button fill="clear" color="light">{{ 'ITEMS.CONTACT' | translate }}</ion-button>
       </ion-col>
       <ion-col size="6" class="ion-text-center">
        <ion-button fill="clear" color="dark">{{ 'ITEMS.DESCRIPTION' | translate }}</ion-button>
       </ion-col>
    </ion-row>
  </ion-toolbar>
</ion-footer>
